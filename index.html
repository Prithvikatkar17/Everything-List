<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Everything List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="app-switcher">
        <button class="switcher-btn active" id="btnModeEverything" onclick="switchMode('everything')">
          <span class="brand-icon">✓</span> Everything List
        </button>
        <button class="switcher-btn" id="btnModeRoutines" onclick="switchMode('routines')">
          <span class="brand-icon">🔁</span> Daily Routines
        </button>
      </div>
      <button class="add-btn" onclick="openModal()">
        <span>+</span> Add anything
      </button>

      <nav>
        <button class="nav-item active" data-view="all">
          <span class="nav-icon">📋</span> All <span class="count-badge" id="countAll">0</span>
        </button>
        <button class="nav-item" data-view="today">
          <span class="nav-icon">☀️</span> Today <span class="count-badge" id="countToday">0</span>
        </button>
        <button class="nav-item" data-view="upcoming">
          <span class="nav-icon">🗓️</span> Upcoming <span class="count-badge" id="countUpcoming">0</span>
        </button>
        <button class="nav-item" data-view="someday">
          <span class="nav-icon">🌙</span> Someday <span class="count-badge" id="countSomeday">0</span>
        </button>
        <button class="nav-item" data-view="completed">
          <span class="nav-icon">✅</span> Completed
        </button>
      </nav>

      <div class="sidebar-section" id="sidebarCategories">
        <p>Categories</p>
        <button class="category-item" data-category="Goal"><span class="cat-icon">🎯</span> Goal</button>
        <button class="category-item" data-category="Task"><span class="cat-icon">📌</span> Task</button>
        <button class="category-item" data-category="Watch"><span class="cat-icon">🎬</span> Watch</button>
        <button class="category-item" data-category="YouTube"><span class="cat-icon">▶️</span> YouTube</button>
        <button class="category-item" data-category="Learn"><span class="cat-icon">📚</span> Learn</button>
        <button class="category-item" data-category="Buy"><span class="cat-icon">🛒</span> Buy</button>
        <button class="category-item" data-category="Habit"><span class="cat-icon">🌱</span> Habit</button>
        <button class="category-item" data-category="Idea"><span class="cat-icon">💡</span> Idea</button>
      </div>

      <div class="theme-toggle-container">
        <button id="themeToggle" class="theme-toggle">
          <span class="light-icon">☀️ Light Mode</span>
          <span class="dark-icon" style="display:none;">🌙 Dark Mode</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <header>
        <div>
          <p class="eyebrow" id="viewEyebrow">YOUR PERSONAL INBOX</p>
          <h1 id="viewTitle">Everything</h1>
          <p id="viewSubtitle">Capture anything you don't want to forget.</p>
        </div>
        <div class="header-actions">
          <div class="search-container">
            <span class="search-icon">🔍</span>
            <input id="search" type="search" placeholder="Search tasks..." oninput="render()">
          </div>
          <button class="mobile-add" onclick="openModal()">+</button>
          <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
        </div>
      </header>

      <section class="stats" id="mainStats">
        <div class="stat-card">
          <strong id="statOpen">0</strong>
          <span>Open Tasks</span>
        </div>
        <div class="stat-card">
          <strong id="statToday">0</strong>
          <span>Due Today</span>
        </div>
        <div class="stat-card stat-done">
          <strong id="statDone">0</strong>
          <span>Completed</span>
        </div>
      </section>

      <section id="taskList" class="task-list"></section>
    </main>
  </div>

  <div id="modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Add anything</h2>
        <button onclick="closeModal()" class="close-btn">×</button>
      </div>

      <form id="taskForm">
        <label>What do you want to remember?</label>
        <input id="title" required placeholder="e.g. Watch Interstellar" class="form-input">

        <div class="form-grid">
          <div>
            <label>Type</label>
            <select id="category" class="form-input">
              <option>Task</option>
              <option>Goal</option>
              <option>Watch</option>
              <option>YouTube</option>
              <option>Learn</option>
              <option>Buy</option>
              <option>Habit</option>
              <option>Idea</option>
            </select>
          </div>
          <div>
            <label>Priority</label>
            <select id="priority" class="form-input">
              <option>Low</option>
              <option selected>Medium</option>
              <option>High</option>
            </select>
          </div>
        </div>

        <div class="form-grid" id="repeatFields" style="display:none">
          <div>
            <label>Repeat</label>
            <select id="repeat" class="form-input">
              <option value="none">None</option>
              <option value="daily">Daily</option>
            </select>
          </div>
          <div>
            <!-- Placeholder for grid -->
          </div>
        </div>

        <div class="form-grid" id="scheduleFields">
          <div>
            <label>When? <small>(optional)</small></label>
            <input id="date" type="date" class="form-input">
          </div>
          <div>
            <label>Reminder time <small>(optional)</small></label>
            <input id="time" type="time" class="form-input">
          </div>
        </div>

        <label>Link <small>(optional — YouTube, movie page, etc.)</small></label>
        <input id="link" type="url" placeholder="https://..." class="form-input">

        <label>Notes <small>(optional)</small></label>
        <textarea id="notes" rows="3" placeholder="Anything else..." class="form-input"></textarea>

        <div class="modal-actions">
          <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
          <button type="submit" class="save">Add to list</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>

</html>
